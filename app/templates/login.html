
{% extends "base.html" %}

{% block title %}Login | AERIS{% endblock %}

{% block content %}

<section class="auth-container">

    <div class="auth-card">

        <p class="eyebrow">AEROSPACE INTELLIGENCE</p>

        <h1>Welcome Back</h1>

        <p class="muted">
            Sign in to access your AERIS dashboard.
        </p>

        <form method="POST" action="{{ url_for('auth.login') }}">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit" class="btn btn-primary">
                Sign In
            </button>

        </form>

        <div class="auth-divider">
            <span>OR</span>
        </div>

        <a href="{{ url_for('auth.google_login') }}"
           class="btn btn-google">
            Continue with Google
        </a>

        <p class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}">Create Account</a>
        </p>

    </div>

</section>

{% endblock %}
